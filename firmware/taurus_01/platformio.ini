; NEXUS TAURUS OPERATIONS - TAURUS-01 Firmware
; Platform: Yahboom G1 Tank with ESP32-S3
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build settings
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DVEHICLE_ID=\"TAURUS-01\"

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0

; Upload settings
upload_speed = 921600

; Build optimization
build_type = release
